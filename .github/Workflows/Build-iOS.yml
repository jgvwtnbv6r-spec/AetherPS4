name: Build AetherPS4 iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Make build script executable
        run: chmod +x runtime/scripts/build-ipa.sh

      - name: Build IPA
        run: ./runtime/scripts/build-ipa.sh

      - name: Find IPA
        run: |
          find . -type f -name "*.ipa" -print

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AetherPS4-iOS
          path: "**/*.ipa"
          if-no-files-found: error
